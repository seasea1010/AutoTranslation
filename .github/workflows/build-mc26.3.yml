name: Minecraft 26.3 Fabric build

on:
  push:
    branches:
      - mc26.3-fabric
  pull_request:
    branches:
      - mc26.3-fabric
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Fabric mod
        run: ./gradlew :fabric:build --stacktrace
      - name: Upload Fabric JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoTranslation-mc26.3-fabric
          path: |
            fabric/build/libs/*.jar
            common/build/libs/*.jar
          if-no-files-found: warn
