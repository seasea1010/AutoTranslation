plugins {
    id "dev.architectury.loom-no-remap"
}

architectury {
    common("fabric")
}

dependencies {
    // The common source set is compiled as a plain shared Java module. Loom's
    // modImplementation/modApi configurations are not created by loom-no-remap
    // in this module, so use standard Gradle configurations here.
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "dev.architectury:architectury:${rootProject.architectury_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

sourceSets {
    main {
        java {
            // Patchouli has no Minecraft 26.3 release yet; keep its optional
            // compatibility mixins out of this target until the API is ported.
            exclude 'me/langyue/autotranslation/mixin/compat/patchouli/**'
        }
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
